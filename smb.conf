[global]
workgroup = WORKGROUP
server string = Jio STB USB NAS
security = user
map to guest = Bad User
username map = /data/data/com.termux/files/usr/etc/samba/users.map
smb ports = 4445
max protocol = SMB3
min protocol = SMB2
socket options = TCP_NODELAY SO_RCVBUF=524288 SO_SNDBUF=524288
read raw = yes
write raw = yes
follow symlinks = yes
wide links = yes
unix extensions = no

[Jio_NAS]
path = /data/data/com.termux/files/home/NAS_Root
writable = yes
browseable = yes
guest ok = yes
force user = u0_a79

[External_USB]
path = /storage/01DBB788C951D420
writable = yes
browseable = yes
guest ok = yes
force user = u0_a79

[USB_Storage]
path = /data/data/com.termux/files/home/NAS_Root/External_Drives
writable = yes
browseable = yes
guest ok = yes
force user = u0_a79

[Internal_Storage]
path = /sdcard
writable = yes
browseable = yes
guest ok = yes
force user = u0_a79